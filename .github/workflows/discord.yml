name: Discord Push Notification

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send push notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'No message' }}
          COMMIT_URL: ${{ github.event.head_commit.html_url || '' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          # Validate webhook URL
          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook:
              print("Error: DISCORD_WEBHOOK is empty")
              exit(1)

          payload = {
              "embeds": [
                  {
                      "title": "🚀 New Git push",
                      "description": (
                          f"**Repository:** `{os.environ['REPO']}`\n"
                          f"**Branch:** `{os.environ['BRANCH']}`\n"
                          f"**Author:** `{os.environ['ACTOR']}`\n\n"
                          f"**Commit:** [{os.environ['COMMIT_SHA'][:7]}]({os.environ['COMMIT_URL']})\n"
                          f"**Message:** {os.environ['COMMIT_MESSAGE']}"
                      ),
                      "footer": {
                          "text": "GitHub → Discord"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
