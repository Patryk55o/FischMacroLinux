name: Notify Discord on push
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD_ID: ${{ github.event.head_commit.id || github.sha }}
          HEAD_MSG: ${{ github.event.head_commit.message || '' }}
          HEAD_URL: ${{ github.event.head_commit.url || '' }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          HEAD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping."
            exit 0
          fi

          # Truncate fields to Discord limits and escape quotes
          TITLE="New commit pushed to $REPO"
          DESCRIPTION=$(printf "%s" "$HEAD_MSG" | sed 's/"/\\"/g' | cut -c1-2048)
          COMMIT=$(printf "%s" "${HEAD_ID:-$GITHUB_SHA}" | cut -c1-1024)
          AUTHOR="${HEAD_AUTHOR:-$GITHUB_ACTOR}"
          REF_SHORT="${REF#refs/heads/}"
          TIMESTAMP="${HEAD_TIME}"

          PAYLOAD=$(cat <<EOF
{"embeds":[{"title":"$TITLE","description":"$DESCRIPTION","url":"$HEAD_URL","timestamp":"$TIMESTAMP","fields":[{"name":"Commit","value":"$COMMIT","inline":true},{"name":"Author","value":"$AUTHOR","inline":true},{"name":"Ref","value":"$REF_SHORT","inline":true}]}]}
EOF
)

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK" || true
