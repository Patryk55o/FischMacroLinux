name: Notify Discord on push
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD_ID: ${{ github.event.head_commit.id || github.sha }}
          HEAD_MSG: ${{ github.event.head_commit.message || '' }}
          HEAD_URL: ${{ github.event.head_commit.url || '' }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          HEAD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping."
            exit 0
          fi

          # Prepare a short ref name for display
          export REF_SHORT="${REF#refs/heads/}"

          # Use a small Python snippet to build safe JSON and pipe it to curl,
          # avoiding shell-quoting/here-doc issues.
          python3 - <<'PY' | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
            import os, json
            repo = os.environ.get("REPO","")
            payload = {
              "embeds": [{
                "title": f"New commit pushed to {repo}",
                "description": os.environ.get("HEAD_MSG","")[:2048],
                "url": os.environ.get("HEAD_URL",""),
                "timestamp": os.environ.get("HEAD_TIME",""),
                "fields": [
                  {"name":"Commit", "value": os.environ.get("HEAD_ID", os.environ.get("GITHUB_SHA",""))[:1024], "inline": True},
                  {"name":"Author", "value": os.environ.get("HEAD_AUTHOR", os.environ.get("GITHUB_ACTOR","")), "inline": True},
                  {"name":"Ref", "value": os.environ.get("REF_SHORT",""), "inline": True}
                ]
              }]
            }
          print(json.dumps(payload))
          PY
