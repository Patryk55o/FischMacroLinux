name: Notify Discord on push
on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD_ID: ${{ github.event.head_commit.id || github.sha }}
          HEAD_MSG: ${{ github.event.head_commit.message || '' }}
          HEAD_URL: ${{ github.event.head_commit.url || '' }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          HEAD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping."
            exit 0
          fi

          # Shorten fields to Discord limits
          TITLE="New commit pushed to $REPO"
          DESCRIPTION="${HEAD_MSG:0:2048}"
          COMMIT="${HEAD_ID:-$GITHUB_SHA}"
          COMMIT="${COMMIT:0:1024}"
          AUTHOR="${HEAD_AUTHOR:-$GITHUB_ACTOR}"
          REF_SHORT="${REF#refs/heads/}"
          TIMESTAMP="${HEAD_TIME}"

          # Ensure jq exists (install if needed)
          if ! command -v jq >/dev/null; then
            echo "jq not found — installing..."
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg url "$HEAD_URL" \
            --arg timestamp "$TIMESTAMP" \
            --arg commit "$COMMIT" \
            --arg author "$AUTHOR" \
            --arg ref "$REF_SHORT" \
            '{embeds:[{title:$title,description:$description,url:$url,timestamp:$timestamp,fields:[{name:"Commit",value:$commit,inline:true},{name:"Author",value:$author,inline:true},{name:"Ref",value:$ref,inline:true}]}]}')

          echo "$PAYLOAD" | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
