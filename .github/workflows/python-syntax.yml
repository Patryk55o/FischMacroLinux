name: Python syntax check

on:
  push:
  pull_request:

jobs:
  py_compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check fisch-macro.py syntax
        run: python -m py_compile fisch-macro.py
